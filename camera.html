<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no">

  <title>
    Inventory Barcode Camera
  </title>


  <!--
    ZXing browser barcode scanner.
  -->

  <script
    src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      overflow: hidden;

    }


    .app {

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

    }


    .top {

      padding: 13px 14px;

      background: #111827;

      text-align: center;

      flex: 0 0 auto;

    }


    .top strong {

      display: block;

      font-size: 18px;

    }


    .top div {

      margin-top: 5px;

      font-size: 13px;

      opacity: .8;

    }


    .video-wrap {

      position: relative;

      flex: 1 1 auto;

      min-height: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #000;

    }


    video {

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

    }


    .guide {

      position: absolute;

      width: 78%;

      max-width: 440px;

      height: 110px;

      border: 3px solid #22c55e;

      border-radius: 14px;

      box-shadow:
        0 0 0 9999px
        rgba(0, 0, 0, .28);

      pointer-events: none;

    }


    .scan-line {

      position: absolute;

      left: 8px;
      right: 8px;

      top: 50%;

      height: 2px;

      background: #ef4444;

      box-shadow:
        0 0 8px #ef4444;

      animation:
        scanLine 1.8s
        infinite
        ease-in-out;

    }


    @keyframes scanLine {

      0% {
        transform:
          translateY(-40px);
      }

      50% {
        transform:
          translateY(40px);
      }

      100% {
        transform:
          translateY(-40px);
      }

    }


    .status {

      position: absolute;

      left: 12px;
      right: 12px;

      bottom: 14px;

      padding: 11px 12px;

      border-radius: 10px;

      background:
        rgba(0, 0, 0, .72);

      text-align: center;

      font-size: 14px;

      line-height: 1.4;

    }


    .bottom {

      padding: 12px;

      background: #111827;

      flex: 0 0 auto;

    }


    button {

      width: 100%;

      min-height: 50px;

      border: 0;

      border-radius: 11px;

      font-size: 17px;

      font-weight: 700;

      background: #fff;

      color: #111827;

    }


    button:disabled {

      opacity: .45;

    }


    .error {

      display: none;

      margin: 10px 12px 0;

      padding: 11px;

      border-radius: 9px;

      background: #3a1111;

      color: #fecaca;

      font-size: 13px;

      line-height: 1.5;

    }


    .error.show {

      display: block;

    }


    .debug {

      display: none;

      margin: 10px 12px 0;

      padding: 10px;

      border-radius: 8px;

      background: #1f2937;

      color: #d1d5db;

      font-family: monospace;

      font-size: 10px;

      line-height: 1.5;

      word-break: break-word;

    }


    .debug.show {

      display: block;

    }

  </style>

</head>


<body>

<div class="app">


  <!-- HEADER -->

  <div class="top">

    <strong>
      Inventory Barcode Scanner
    </strong>

    <div id="modeText">
      Starting camera...
    </div>

  </div>


  <!-- CAMERA -->

  <div class="video-wrap">

    <video
      id="camera"
      playsinline
      muted
      autoplay>
    </video>


    <div class="guide">

      <div class="scan-line"></div>

    </div>


    <div
      id="status"
      class="status">

      Starting camera...

    </div>

  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="error">
  </div>


  <!-- DEBUG -->

  <div
    id="debug"
    class="debug">
  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <button
      id="closeButton"
      type="button">

      CANCEL

    </button>

  </div>

</div>


<script>

/* =========================================================
   STATE
   ========================================================= */

let reader =
  null;

let controls =
  null;

let processing =
  false;


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const mode =
  params.get("mode") === "user"
    ? "user"
    : "item";


/*
 * The parent Apps Script page sends
 * its actual origin to this page.
 */

const returnOrigin =
  params.get("returnOrigin") || "*";


/* =========================================================
   ELEMENTS
   ========================================================= */

const camera =
  document.getElementById(
    "camera"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const errorEl =
  document.getElementById(
    "error"
  );

const debugEl =
  document.getElementById(
    "debug"
  );

const modeText =
  document.getElementById(
    "modeText"
  );

const closeButton =
  document.getElementById(
    "closeButton"
  );


/* =========================================================
   MODE
   ========================================================= */

modeText.textContent =
  mode === "item"

    ? "Scan the item barcode"

    : "Scan the user barcode";


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  text
) {

  statusEl.textContent =
    text || "";

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(
  text
) {

  errorEl.textContent =
    text ||
    "Unknown camera error.";

  errorEl.classList.add(
    "show"
  );

  setStatus(
    "Camera could not continue."
  );

}


/* =========================================================
   DEBUG
   ========================================================= */

function showDebug(
  text
) {

  debugEl.textContent =
    text || "";

  debugEl.classList.add(
    "show"
  );

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  /*
   * Stop ZXing.
   */

  if (controls) {

    try {

      if (
        typeof controls.stop ===
        "function"
      ) {

        controls.stop();

      }

    } catch (error) {

      console.warn(
        "ZXing controls stop:",
        error
      );

    }

    controls =
      null;

  }


  /*
   * Reset reader.
   */

  if (reader) {

    try {

      if (
        typeof reader.reset ===
        "function"
      ) {

        reader.reset();

      }

    } catch (error) {

      console.warn(
        "ZXing reader reset:",
        error
      );

    }

    reader =
      null;

  }


  /*
   * Stop media tracks.
   */

  try {

    const stream =
      camera.srcObject;

    if (
      stream &&
      stream.getTracks
    ) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            try {

              track.stop();

            } catch (error) {

              console.warn(
                "Track stop:",
                error
              );

            }

          }
        );

    }

  } catch (error) {

    console.warn(
      "Stream cleanup:",
      error
    );

  }


  /*
   * Stop video.
   */

  try {

    camera.pause();

  } catch (error) {

    console.warn(
      "Video pause:",
      error
    );

  }


  camera.srcObject =
    null;

}


/* =========================================================
   SEND BARCODE
   ========================================================= */

function finishBarcode(
  value
) {

  if (
    processing
  ) {

    return;

  }


  const barcode =
    String(
      value || ""
    ).trim();


  if (!barcode) {

    return;

  }


  processing =
    true;


  console.log(
    "BARCODE DETECTED:",
    barcode
  );


  setStatus(
    "Barcode detected. Sending..."
  );


  /*
   * Check parent.
   */

  const parentWindow =
    window.opener;


  if (
    !parentWindow ||
    parentWindow.closed
  ) {

    processing =
      false;


    showError(
      "The inventory page is no longer connected. " +
      "Close this page and start the scanner again."
    );


    return;

  }


  /*
   * Prepare message.
   */

  const message = {

    type:
      "barcode-scanned",

    mode:
      mode,

    barcode:
      barcode

  };


  try {

    /*
     * Use the exact parent origin
     * passed in the URL.
     *
     * If it is unavailable, use "*".
     * The parent still verifies our
     * GitHub origin and window source.
     */

    parentWindow.postMessage(
      message,
      returnOrigin || "*"
    );


    console.log(
      "BARCODE MESSAGE SENT:",
      message
    );


    showDebug(
      "Barcode sent successfully. " +
      "Mode=" +
      mode +
      " | Barcode=" +
      barcode
    );


    setStatus(
      "Barcode sent. Returning..."
    );


  } catch (error) {

    console.error(
      "POSTMESSAGE ERROR:",
      error
    );


    processing =
      false;


    showError(
      "The barcode was detected, " +
      "but could not be returned to the inventory page."
    );


    showDebug(
      "postMessage error: " +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


    return;

  }


  /*
   * Stop camera.
   */

  stopCamera();


  /*
   * Close this camera window.
   */

  setTimeout(
    function() {

      try {

        window.close();

      } catch (error) {

        console.warn(
          "Window close:",
          error
        );

      }

    },
    300
  );

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  try {

    /*
     * ZXing check.
     */

    if (
      typeof ZXingBrowser ===
      "undefined"
    ) {

      throw new Error(
        "ZXing failed to load. " +
        "Check your internet connection."
      );

    }


    /*
     * Camera API check.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera access is not available " +
        "in this browser."
      );

    }


    setStatus(
      "Requesting camera permission..."
    );


    /*
     * Create ZXing reader.
     */

    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * Start scanning.
     */

    controls =
      await reader.decodeFromConstraints(

        {

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        },

        camera,


        function(
          result,
          error
        ) {

          /*
           * Ignore everything after
           * the first barcode.
           */

          if (
            processing
          ) {

            return;

          }


          /*
           * ZXing calls this callback
           * repeatedly while scanning.
           */

          if (
            !result ||
            typeof result.getText !==
            "function"
          ) {

            return;

          }


          const value =
            String(
              result.getText() || ""
            ).trim();


          if (!value) {

            return;

          }


          /*
           * Barcode found.
           */

          finishBarcode(
            value
          );

        }

      );


    setStatus(
      "Camera ready. Point it at the barcode."
    );


    console.log(
      "Camera started successfully."
    );


  } catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    let message =
      "Could not access the camera.";


    if (
      error &&
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. " +
        "Allow camera access for this site " +
        "and try again.";

    }

    else if (
      error &&
      error.name ===
      "NotFoundError"
    ) {

      message =
        "No camera was found on this device.";

    }

    else if (
      error &&
      error.name ===
      "NotReadableError"
    ) {

      message =
        "The camera is already being used " +
        "by another app or browser tab.";

    }

    else if (
      error &&
      error.name ===
      "SecurityError"
    ) {

      message =
        "The browser blocked camera access. " +
        "Make sure this page is opened over HTTPS.";

    }

    else if (
      error &&
      error.message
    ) {

      message =
        error.message;

    }


    showError(
      message
    );


    showDebug(
      "Camera error: " +
      (
        error &&
        error.name
          ? error.name
          : "Unknown"
      ) +
      " | " +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  }

}


/* =========================================================
   CANCEL
   ========================================================= */

closeButton.addEventListener(
  "click",
  function() {

    stopCamera();

    try {

      window.close();

    } catch (error) {

      console.warn(
        "Window close:",
        error
      );

    }

  }
);


/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  "pagehide",
  function() {

    stopCamera();

  }
);


window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);


/* =========================================================
   START
   ========================================================= */

startCamera();

</script>

</body>

</html>
