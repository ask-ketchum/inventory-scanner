<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Inventory Barcode Camera</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .top {
      padding: 12px 14px;
      background: #111;
      text-align: center;
      flex: 0 0 auto;
    }
    .top strong { font-size: 17px; }
    .top div { margin-top: 4px; font-size: 13px; opacity: .75; }
    .video-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .guide {
      position: absolute;
      width: 76%;
      max-width: 420px;
      height: 110px;
      border: 3px solid #fff;
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.25);
      pointer-events: none;
    }
    .status {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.68);
      text-align: center;
      font-size: 14px;
    }
    .bottom {
      padding: 12px;
      background: #111;
      flex: 0 0 auto;
    }
    button {
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      background: #fff;
      color: #111;
    }
    button:disabled { opacity: .45; }
    .error {
      display: none;
      margin: 10px 12px 0;
      padding: 10px;
      border-radius: 8px;
      background: #3a1111;
      color: #ffb4b4;
      font-size: 13px;
    }
    .error.show { display: block; }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <strong>Inventory Barcode Scanner</strong>
      <div id="modeText">Starting camera…</div>
    </div>

    <div class="video-wrap">
      <video id="camera" playsinline muted autoplay></video>
      <div class="guide"></div>
      <div class="status" id="status">Requesting camera permission…</div>
    </div>

    <div class="error" id="error"></div>

    <div class="bottom">
      <button id="closeButton" type="button">Cancel</button>
    </div>
  </div>

  <script>
    let reader = null;
    let controls = null;
    let processing = false;

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") === "user" ? "user" : "item";

    const camera = document.getElementById("camera");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const modeText = document.getElementById("modeText");
    const closeButton = document.getElementById("closeButton");

    modeText.textContent =
      mode === "item"
        ? "Scan the item barcode"
        : "Scan the user barcode";

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function showError(text) {
      errorEl.textContent = text;
      errorEl.classList.add("show");
      setStatus("Camera could not be started.");
    }

    function stopCamera() {
      try {
        if (controls && typeof controls.stop === "function") {
          controls.stop();
        }
      } catch (e) {}

      controls = null;

      try {
        if (reader && typeof reader.reset === "function") {
          reader.reset();
        }
      } catch (e) {}

      reader = null;

      try {
        const stream = camera.srcObject;
        if (stream && stream.getTracks) {
          stream.getTracks().forEach(function(track) {
            try { track.stop(); } catch (e) {}
          });
        }
      } catch (e) {}

      try { camera.pause(); } catch (e) {}
      camera.srcObject = null;
    }

    function finishBarcode(value) {
      if (processing) return;
      processing = true;

      setStatus("Barcode found. Stopping camera…");
      stopCamera();

      if (!window.opener || window.opener.closed) {
        showError("The inventory page is no longer open. Return to the inventory page and scan again.");
        return;
      }

      /*
       * The parent page is the Apps Script web app. The parent
       * validates this page's origin before accepting the message.
       */
      window.opener.postMessage(
        {
          type: "barcode-scanned",
          mode: mode,
          barcode: value
        },
        "https://script.google.com"
      );

      setStatus("Barcode sent. Returning to inventory…");

      setTimeout(function() {
        try { window.close(); } catch (e) {}
      }, 250);
    }

    async function startCamera() {
      try {
        if (typeof ZXingBrowser === "undefined") {
          throw new Error("ZXing failed to load.");
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Camera access is not available in this browser.");
        }

        setStatus("Requesting camera permission…");

        reader = new ZXingBrowser.BrowserMultiFormatReader();

        controls = await reader.decodeFromConstraints(
          {
            video: {
              facingMode: { exact: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          },
          camera,
          function(result, error) {
            if (processing) return;

            if (!result || typeof result.getText !== "function") {
              return;
            }

            const value = String(result.getText() || "").trim();
            if (!value) return;

            finishBarcode(value);
          }
        );

        setStatus("Camera ready. Point it at the barcode.");
      } catch (error) {
        console.error(error);

        let message = "Could not access the camera.";

        if (error && error.name === "NotAllowedError") {
          message = "Camera permission was denied or blocked. Allow camera access for this site and try again.";
        } else if (error && error.name === "NotFoundError") {
          message = "No camera was found on this device.";
        } else if (error && error.name === "NotReadableError") {
          message = "The camera is already being used by another app or browser tab.";
        } else if (error && error.message) {
          message = error.message;
        }

        showError(message);
      }
    }

    closeButton.addEventListener("click", function() {
      stopCamera();
      try { window.close(); } catch (e) {}
    });

    window.addEventListener("pagehide", stopCamera);
    window.addEventListener("beforeunload", stopCamera);

    startCamera();
  </script>
</body>
</html>
